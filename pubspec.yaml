name: indir_gitsin
description: YouTube ve YouTube Music indirme uygulaması - modern ve kullanıcı dostu
publish_to: 'none'
version: 1.4.2+26

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # YouTube core - saf Dart ile video bilgisi ve stream çekme
  youtube_explode_dart: ^2.5.2
  # Durum yönetimi
  flutter_riverpod: ^2.6.1
  # Paylaşım / Intent - 1.8.1 namespace uyumlu (AGP 8)
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.4
  # İzinler & dosya sistemi
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  path: ^1.9.0
  # İndirme & ağ
  dio: ^5.7.0
  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  # Diğer
  url_launcher: ^6.2.6
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  open_filex: ^4.7.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  dynamic_color: 1.7.0
  video_player: ^2.8.6
  chewie: ^1.8.1
  easy_localization: ^3.0.7
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/translations/
  generate: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FF0A0A"
    theme_color: "#FF0A0A"
