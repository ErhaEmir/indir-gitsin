name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Patch plugins for JDK17 (JVM target mismatch fix)
        run: |
          echo "Patching plugins for JDK17..."
          PUB_CACHE=$(flutter pub cache dir 2>/dev/null || echo "$HOME/.pub-cache")
          echo "PUB_CACHE=$PUB_CACHE"
          ls -R "$PUB_CACHE/hosted/pub.dev" 2>&1 | head -20
          find "$PUB_CACHE" -name "build.gradle" 2>/dev/null | xargs grep -l "VERSION_1_8" 2>/dev/null | head -20
          find "$PUB_CACHE" -name "build.gradle" -exec grep -l "VERSION_1_8" {} \; 2>/dev/null | while read f; do
            echo "Patching $f"
            sed -i 's/VERSION_1_8/VERSION_17/g' "$f"
            sed -i 's/"1.8"/"17"/g' "$f"
            sed -i "s/'1.8'/'17'/g" "$f"
          done
          echo "Patch done - verifying receive_sharing_intent:"
          find "$PUB_CACHE" -path "*receive_sharing_intent*" -name "build.gradle" -exec cat {} \; 2>&1 | head -60

      - name: Ensure Android scaffold (flutter create if missing)
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Android scaffold missing, regenerating..."
            flutter create --platforms=android . --project-name indir_gitsin --org com.indirgitsin
            # restore custom AndroidManifest with share intent
            git checkout -- android/app/src/main/AndroidManifest.xml || true
          fi
          cat android/settings.gradle || true
          cat android/app/build.gradle || true

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Get version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: "İndir Gitsin v${{ steps.ver.outputs.version }} (${{ github.run_number }})"
          body: |
            ## İndir Gitsin - Otomatik Sürüm
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - YouTube & YouTube Music destekli
            ### Kurulum
            `app-release.apk` dosyasını indir ve kur. Alternatif: `app-arm64-v8a-release.apk` vb.
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
