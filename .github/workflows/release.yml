name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Patch plugins for JDK17 (JVM target mismatch fix)
        run: |
          echo "Patching receive_sharing_intent and other plugins..."
          find ~/.pub-cache -path "*receive_sharing_intent*android/build.gradle" -print -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \; -exec sed -i 's/"1.8"/"17"/g' {} \; -exec cat {} \; 2>&1 | head -80
          find ~/.pub-cache -path "*device_info_plus*android/build.gradle" -print -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \; -exec sed -i 's/"1.8"/"17"/g' {} \; 2>&1 | head -20
          find ~/.pub-cache -path "*path_provider*android/build.gradle" -print -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \; 2>&1 | head -20
          echo "Patch done"

      - name: Ensure Android scaffold (flutter create if missing)
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Android scaffold missing, regenerating..."
            flutter create --platforms=android . --project-name indir_gitsin --org com.indirgitsin
            # restore custom AndroidManifest with share intent
            git checkout -- android/app/src/main/AndroidManifest.xml || true
          fi
          cat android/settings.gradle || true
          cat android/app/build.gradle || true

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Get version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: "İndir Gitsin v${{ steps.ver.outputs.version }} (${{ github.run_number }})"
          body: |
            ## İndir Gitsin - Otomatik Sürüm
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - YouTube & YouTube Music destekli
            ### Kurulum
            `app-release.apk` dosyasını indir ve kur. Alternatif: `app-arm64-v8a-release.apk` vb.
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
